<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hall of Shame</title>

    <link
        rel="stylesheet"
        href="hos.css"
    >

</head>


<body>


<header>

    <div class="brand">

        ABUSEMENT PARK

    </div>


    <button
        class="back-button"
        id="backButton"
    >

        ← DASHBOARD

    </button>

</header>



<main>


    <!-- =========================
         HERO
    ========================== -->

    <section class="hero">


        <div class="trophy">

            🏆

        </div>


        <p class="small-title">

            LEADERBOARD

        </p>


        <h1>

            HALL OF SHAME

        </h1>


        <p class="subtitle">

            Time to prove who's the GOAT of the GC and unlock privileges.

        </p>


    </section>



    <!-- =========================
         YOUR RANK
    ========================== -->

    <section
        class="your-rank"
        id="yourRankCard"
    >


        <div class="your-rank-left">


            <span class="your-rank-label">

                YOUR RANK

            </span>


            <strong
                id="yourRank"
            >

                #-

            </strong>


        </div>


        <div class="your-rank-right">


            <span class="your-cp-label">

                YOUR CHAOS

            </span>


            <strong>

                <span
                    id="yourChaosPoints"
                >

                    0

                </span>

                CP

            </strong>


        </div>


    </section>



    <!-- =========================
         LEADERBOARD
    ========================== -->

    <section class="leaderboard">


        <div class="section-heading">


            <h2>

                🏆 GLOBAL CHAOS

            </h2>


            <span
                id="memberCount"
            >

                LOADING...

            </span>


        </div>



        <div
            class="leaderboard-list"
            id="leaderboardList"
        >


            <div class="loading">

                Loading the victims...

            </div>


        </div>


    </section>


</main>



<script
    type="module"
    src="js/hos.js"
></script>


</body>

</html>
