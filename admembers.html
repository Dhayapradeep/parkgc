<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Manage Members | Abusement Park</title>

    <link
        rel="stylesheet"
        href="admembers.css">

</head>

<body>

<header>

    <div class="brand">
        ABUSEMENT PARK
    </div>

    <a
        href="admin.html"
        class="back">
        ← ADMIN PANEL
    </a>

</header>


<main>

    <!-- PAGE HEADING -->

    <section class="page-heading">

        <span class="icon">
            👥
        </span>

        <p>
            ADMINISTRATION
        </p>

        <h1>
            MEMBERS
        </h1>

        <span class="line"></span>

        <small>
            Manage Abusement Park members
        </small>

    </section>


    <!-- MEMBER COUNT -->

    <section class="member-count">

        <span>
            TOTAL MEMBERS
        </span>

        <strong id="memberCount">
            0
        </strong>

    </section>


    <!-- MEMBERS -->

    <section>

        <div
            id="membersList"
            class="members-list">

            <div class="loading">
                Loading members...
            </div>

        </div>

    </section>

</main>


<script
    type="module"
    src="js/admembers.js">
</script>

</body>

</html>
